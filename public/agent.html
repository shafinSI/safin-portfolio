<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shafin's Personal Agent</title>
<style>
  :root{
    --bg: #0f172a;
    --panel: #111827;
    --accent: #38bdf8;
    --accent2: #22d3ee;
    --user-bubble: #1f4e5f;
    --bot-bubble: #1e293b;
    --text: #e5e7eb;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #1e293b, #020617);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
  }
  .header {
    text-align: center;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #1f2937;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .chat-log {
    height: 420px;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }
  .bot {
    background: var(--bot-bubble);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .user {
    background: var(--user-bubble);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .bot a { color: var(--accent2); }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 18px 12px;
  }
  .chip {
    background: #1e293b;
    border: 1px solid #334155;
    color: var(--text);
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  form {
    display: flex;
    border-top: 1px solid #1f2937;
    padding: 10px;
    gap: 8px;
  }
  input[type=text] {
    flex: 1;
    background: #0b1220;
    border: 1px solid #1f2937;
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    color: #041017;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  button:active { transform: scale(0.97); }
  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 10px;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🤖 Shafin's Personal Agent</h1>
    <p>Ask me anything about Shafin Imtiaz — skills, projects, education, or how to get in touch.</p>
  </div>

  <div class="card">
    <div class="chat-log" id="chatLog"></div>
    <div class="suggestions" id="suggestions"></div>
    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <div class="footer-note">Rule-based personal agent · Built by Shafin Imtiaz</div>
</div>

<script>
const KB = {
  name: "Shafin Imtiaz",
  role: "Full Stack Developer | AI Enthusiast | Cybersecurity Learner",
  education: "Currently in 10th trimester of BSc in Computer Science & Engineering (CSE) at United International University (UIU), CGPA 3.50. Completed HSC from Cox's Bazar Govt. College with GPA 5.00.",
  skills: {
    frontend: "HTML, CSS, JavaScript, React, Next.js, TypeScript",
    backend: "Node.js, API Routes, MongoDB, Nodemailer",
    programming: "C, C++, Python, Java",
    ai: "Pandas, NumPy, Scikit-learn, Matplotlib"
  },
  projects: [
    { name: "Human Safety App", desc: "A safety-focused web app with emergency alerts, nearest-person notification, safe travel tracking, guardian mode, and emergency contacts.", stack: "Next.js, TypeScript, Node.js, MongoDB, Nodemailer" },
    { name: "Heart Disease Prediction", desc: "A machine learning project predicting heart disease risk and comparing algorithms like KNN and Gradient Boosting.", stack: "Python, Pandas, Scikit-learn" },
    { name: "Smart Rescue Robot", desc: "An Arduino-based rescue robot with Bluetooth control, flame sensor, ultrasonic sensor, buzzer, and motor driver.", stack: "Arduino, C++, HC-05, BTS7960, Sensors" }
  ],
  leadership: "Volunteer Head at UIU Robotics Club, volunteer with Youth Co-Lab, and volunteer at the Computer Club.",
  contact: "Email: shafinimtiaz21@gmail.com · GitHub: github.com/shafinSI · LinkedIn: linkedin.com/in/shafin-imtiaz-81a084267",
  goals: "Over the next 12 months, Shafin aims to complete his CSE degree, build hands-on ML/AI projects, and work toward becoming an ML Engineer / Full Stack AI Developer."
};

function findProject(text) {
  return KB.projects.find(p => text.includes(p.name.toLowerCase().split(" ")[0]));
}

function respond(raw) {
  const text = raw.toLowerCase().trim();

  if (/^(hi|hello|hey|salam|assalamualaikum)\b/.test(text)) {
    return `Hey there! 👋 I'm ${KB.name}'s personal agent. Ask me about his skills, projects, education, or how to reach him.`;
  }
  if (text.includes("who are you") || text.includes("what are you")) {
    return `I'm a small rule-based assistant built by ${KB.name} to answer questions about him — think of me as his digital front-desk. 😄`;
  }
  if (text.includes("skill") || text.includes("tech stack") || text.includes("technolog")) {
    return `Here's a snapshot of ${KB.name}'s skills:\n\n• Frontend: ${KB.skills.frontend}\n• Backend: ${KB.skills.backend}\n• Programming: ${KB.skills.programming}\n• AI/ML: ${KB.skills.ai}`;
  }
  if (text.includes("project")) {
    const p = findProject(text);
    if (p) return `${p.name}: ${p.desc}\nTech used: ${p.stack}`;
    return KB.projects.map(p => `• ${p.name} — ${p.desc}`).join("\n");
  }
  if (text.includes("education") || text.includes("study") || text.includes("university") || text.includes("cgpa") || text.includes("hsc")) {
    return KB.education;
  }
  if (text.includes("volunteer") || text.includes("leadership") || text.includes("club") || text.includes("robotics") || text.includes("youth co-lab")) {
    return KB.leadership;
  }
  if (text.includes("contact") || text.includes("email") || text.includes("reach") || text.includes("linkedin") || text.includes("github")) {
    return `You can reach ${KB.name} here:\n${KB.contact}`;
  }
  if (text.includes("goal") || text.includes("future") || text.includes("plan") || text.includes("next 12 months") || text.includes("aspiration")) {
    return KB.goals;
  }
  if (text.includes("hire") || text.includes("available") || text.includes("internship") || text.includes("job")) {
    return `${KB.name} is open to internships and full-stack/AI opportunities. Feel free to reach out at shafinimtiaz21@gmail.com!`;
  }
  if (text.includes("thank")) {
    return "You're welcome! Let me know if you'd like to know anything else about Shafin. 🙌";
  }
  if (text.includes("bye")) {
    return "Thanks for stopping by! Have a great day. 👋";
  }

  return `I don't have a specific answer for that yet, but I can tell you about ${KB.name}'s skills, projects, education, leadership experience, or how to contact him. Try one of the suggestions below!`;
}

const chatLog = document.getElementById("chatLog");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const suggestionsBar = document.getElementById("suggestions");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg bot typing-wrap";
  div.id = "typingIndicator";
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function handleUserMessage(text) {
  if (!text.trim()) return;
  addMessage(text, "user");
  input.value = "";
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMessage(respond(text), "bot");
  }, 500 + Math.random() * 400);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  handleUserMessage(input.value);
});

const suggestions = ["Tell me about his skills", "Show me his projects", "What's his education?", "How can I contact him?", "What are his goals?"];
suggestions.forEach(s => {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip";
  chip.textContent = s;
  chip.onclick = () => handleUserMessage(s);
  suggestionsBar.appendChild(chip);
});

addMessage(`Hi! I'm ${KB.name}'s personal AI agent. Ask me anything about him — try one of the suggestions below to get started. 👇`, "bot");
</script>
</body>
</html>
